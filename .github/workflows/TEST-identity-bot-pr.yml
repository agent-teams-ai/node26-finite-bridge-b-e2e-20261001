name: TEST identity bot PR fixture
on:
  pull_request_target:
    branches: [identity-qualification-20261002]
    types: [labeled]
permissions:
  contents: read
  pull-requests: write
jobs:
  create-fixture:
    if: github.repository == 'agent-teams-ai/node26-finite-bridge-b-e2e-20261001' && github.actor == '777genius' && github.event.label.name == 'TEST-identity-bot-pr'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            if (pr.base.ref !== 'identity-qualification-20261002' || pr.head.repo.full_name !== context.repo.owner + '/' + context.repo.repo) throw new Error('TEST scope mismatch');
            const head = 'identity-qualification-bot-pr-20261002';
            const ref = await github.rest.git.getRef({ owner, repo, ref: 'heads/' + head });
            if (ref.data.object.sha !== pr.head.sha) throw new Error('TEST bot fixture must use the owner PR exact head');
            const existing = await github.rest.pulls.list({ owner, repo, state: 'open', head: owner + ':' + head, base: pr.base.ref });
            if (existing.data.length) throw new Error('Fixture exists; do not replay');
            const created = await github.rest.pulls.create({ owner, repo, head, base: pr.base.ref, title: 'TEST: bot PR author on owner-authored commit', body: 'Disposable identity qualification fixture. Refs agent-teams-ai/.github#329. Never merge.' });
            core.notice(JSON.stringify({ number: created.data.number, login: created.data.user.login, type: created.data.user.type, head: created.data.head.sha }));
